services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: copy-pen-postgres
    environment:
      POSTGRES_DB: copy-pen
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - copy-pen_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d copy-pen"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  copy-pen_pg_data: